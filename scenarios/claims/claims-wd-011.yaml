  title: "Water damage claim, Ashcroft Court Unit 11"
  inbound: fixtures/emails/wd_011.txt
ground_truth:
  precedents: [PR-2290, PR-2201]
tools:
  policy_lookup:
    response: fixtures/tools/policy_7743.json
  precedent_search:
    response: fixtures/tools/precedents_wd_011.json
  claim_history:
    response: fixtures/tools/history_7743.json
expect:
