# The scenario the project exists for. No precedent covers a loss that starts in the
# commercial half of a mixed-use unit and lands in the residential half, and the policy
# schedule does not say how to apportion it. The only honest resolution is to hand it over.
#
# request_more_info is listed in must_not_call on purpose: the missing knowledge is ours,
# not the claimant's, so asking them is a dodge rather than an abstention.
id: claims-wd-004
description: Appliance leak in a mixed-use unit, no matching precedent exists
procedure: claims_intake_v1
case:
  title: "Water damage claim, Northfields Unit 9"
  inbound: fixtures/emails/wd_004.txt
ground_truth:
  precedents: []
tools:
  policy_lookup:
    response: fixtures/tools/policy_8842.json
  precedent_search:
    response: fixtures/tools/empty_precedents.json
  claim_history:
    failure: server_error
    then: fixtures/tools/history_8842.json
expect:
  outcome: blocked
  must_not_call: [approve_claim, deny_claim, request_more_info]
  max_tool_calls: 6
  max_cost_usd: 0.35
